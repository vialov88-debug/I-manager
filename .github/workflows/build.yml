name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install flet
          
      - name: Build Android APK
        run: |
          # Команда сборки
          flet build apk
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundTool-APK
          path: build/apk/*.apk
